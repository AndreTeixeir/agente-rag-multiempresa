services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_DB: agenterag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5434:5432"
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data

volumes:
  rag-postgres-data:

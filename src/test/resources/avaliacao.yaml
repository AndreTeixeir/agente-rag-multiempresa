    documento_esperado: santo-pegasus-protocolo-incidentes-sre.md
    comportamento_esperado: apontar_inconsistencia
    motivo: "mesmo documento, mesmo evento (incidente SEV-1 de vazamento de dados sensíveis), dois números diferentes para o mesmo prazo, em unidades diferentes (horas úteis vs. dias úteis), sem equivalência explicada no texto"
    trechos_literais:
      - secao: "SEV-1 (Crítico - Intervenção Imediata e Total)"
        texto: |-
          O SLA de notificação à ANPD é de 48 horas úteis, tornando a resposta SEV-1 uma operação com escrutínio legal.
      - secao: "10. Cultura 5 Porquês, O Post-Mortem e a Notificação à ANPD"
        texto: |-
          A lei exige notificação formal e fundamentada à Autoridade Nacional de Proteção de Dados (ANPD) em um prazo estritamente de 2 (dois) dias úteis após a ciência inequívoca do evento.


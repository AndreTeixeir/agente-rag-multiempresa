  - id: ambiguidade-temperatura-sobreposta
    empresa: mercado-central
    pergunta: "Um produto refrigerado chega a 3°C — ele se enquadra na categoria 'Carnes e Aves in natura' ou 'Laticínios e Derivados'?"
    documento_esperado: mercado-central-fornecedores-compras.md
    secao_esperada: "5.4 Checagem de Temperatura e Qualidade"
    comportamento_esperado: apontar_inconsistencia
    motivo: "as faixas ideais de 'Carnes e Aves in natura' (0°C a 4°C) e 'Laticínios e Derivados' (2°C a 8°C) se sobrepõem entre 2°C e 4°C — um produto a 3°C se enquadra nas duas categorias, que têm tolerâncias máximas diferentes (até 7°C vs. até 10°C), e o documento não define qual prevalece"
    trechos_literais:
      - texto: |-
          | Refrigerados — Carnes e Aves in natura | 0°C a 4°C | Até 7°C |
      - texto: |-
          | Refrigerados — Laticínios e Derivados | 2°C a 8°C | Até 10°C |
      - texto: |-
          Nota de transcrição: as faixas de temperatura do documento de origem se sobrepõem em dois pontos — Carnes e Aves (0°C a 4°C) com Laticínios (2°C a 8°C) na faixa de 2°C a 4°C, e Laticínios com Hortifrúti (6°C a 10°C) na faixa de 6°C a 8°C. Nessas faixas, um mesmo produto se enquadra em duas categorias com tolerâncias máximas diferentes, e o documento não define qual prevalece. Os valores foram transcritos como estão no original.

  - id: ambiguidade-orcamento-erro-slo
    empresa: santo-pegasus
    pergunta: "Quanto é o orçamento de erro (error budget) mensal da Santo Pegasus para um SLO de 99,9%?"
    documento_esperado: santo-pegasus-protocolo-incidentes-sre.md
    secao_esperada: "9. Matemática da Confiabilidade e Gestão de Error Budgets (Orçamentos de Erro)"
    comportamento_esperado: apontar_inconsistencia
    motivo: "o documento afirma 43 minutos e 12 segundos, mas 0,1% de 730 horas (SLO de 99,9%) equivale matematicamente a 43 minutos e 48 segundos — erro de conta do PDF de origem, já confirmado por varredura de coerência aritmética (ver docs/DECISOES.md) e marcado com nota de transcrição no próprio .md"
    trechos_literais:
      - texto: |-
          Gestão de Error Budgets (O freio da Engenharia): Se o SLO é 99,9%, significa que aceitamos 0,1% de falha. Em um mês (730 horas), isso equivale a um "Orçamento de Erro" de exatamente 43 minutos e 12 segundos de indisponibilidade permitida.
      - texto: |-
          Nota de transcrição: o documento de origem informa 43 minutos e 12 segundos, mas 0,1% de 730 horas equivale a 43 minutos e 48 segundos. O valor foi transcrito como está no original.

  - id: ambiguidade-staletime-react-query
    empresa: santo-pegasus
    pergunta: "No exemplo de hook do React Query do guia de engenharia front-end da Santo Pegasus, o staleTime está escrito corretamente?"
    documento_esperado: santo-pegasus-guia-engenharia-frontend.md
    secao_esperada: "5.2. Exemplo de Hook React Query"
    comportamento_esperado: apontar_inconsistencia
    motivo: "o código no PDF de origem está sem o operador de multiplicação (`60 1000` em vez de `60 * 1000`) — sintaticamente inválido como impresso. Confirmado por dois extratores de PDF independentes (geometria de glifo e renderização em pixel): faltam 4 asteriscos no próprio PDF, não é erro de conversão. Já marcado com nota de transcrição no próprio .md."
    trechos_literais:
      - texto: |-
          staleTime: 60 1000, // 1 minuto de cache "fresco"
      - texto: |-
          Nota de transcrição: o PDF de origem apresenta este trecho sem o operador `*` (`60 * 1000`). A ausência foi confirmada no documento original — não é erro desta transcrição. O código como impresso não é sintaticamente válido.

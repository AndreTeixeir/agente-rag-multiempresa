spring:
  config:
    # Sufixo [.properties] obrigatório: o Spring escolhe o parser pela
    # extensão do arquivo, e ".env" não é reconhecida — sem o sufixo, o
    # prefixo "optional:" faz o arquivo ser ignorado em silêncio, sem erro
    # nenhum no boot (confirmado empiricamente na Etapa 4.2a: com
    # "optional:file:.env" puro, GEMINI_API_KEY chegava ao Google como o
    # literal "${GEMINI_API_KEY}" e a API respondia API_KEY_INVALID).
    import: optional:file:.env[.properties]
  application:
    name: agente-rag
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/agenterag}
    username: ${DB_USERNAME:rag}
    password: ${DB_PASSWORD:rag}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Schema é gerenciado pelo Flyway (src/main/resources/db/migration), não
      # pelo Hibernate — não há entidade JPA para a tabela document_chunks
      # (o pgvector é acessado via JDBC direto), então não há o que validar.
      ddl-auto: validate

management:
  endpoint:
    health:
      show-details: always

app:
  ingestao:
    embedding:
      # Chave nunca em texto puro no repositório público — só a variável.
      api-key: ${GEMINI_API_KEY}
      model-name: gemini-embedding-001
      # 768, não o padrão de 3072 do modelo — precisa bater com vector(768)
      # da migração V1__chunks_iniciais.sql. Ver docs/DECISOES.md (11/08/2026).
      output-dimensionality: 768
    chunking:
      # ~1000 caracteres ≈ 250 tokens (regra prática de ~4 caracteres/token),
      # bem abaixo do limite de entrada de 2048 tokens do gemini-embedding-001
      # (usa ~12% do limite, com folga para a imprecisão dessa estimativa por
      # caracteres — não temos tokenizador do Gemini no classpath para contar
      # tokens de verdade). Chunk pequeno também favorece precisão de
      # recuperação nesses documentos, que são majoritariamente FAQ/tabela.
      max-segment-size-chars: 1000
      # 20% de overlap — preserva contexto entre chunks vizinhos (ex.: uma
      # regra que continua no chunk seguinte) sem duplicar demais o conteúdo
      # armazenado.
      max-overlap-size-chars: 200
      # hybrid (padrão, decisão confirmada) divide por cabeçalho antes do
      # chunking recursivo — é o que permite preencher o metadado "secao".
      # recursive é a linha de base para comparação da Etapa 4.3 do plano;
      # nunca trocar o padrão sem decisão explícita.
      strategy: hybrid
    vector-store:
      table: document_chunks
    # Pausa entre a ingestão de um documento e o próximo, em milissegundos.
    # 0 = sem pausa.
    # A cota do free tier é de 100 requisições por minuto no endpoint de
    # embeddings (quotaId EmbedContentRequestsPerMinutePerUserPerProjectPerModel-FreeTier),
    # e o Google conta por conteúdo embedado, não por requisição HTTP — um
    # documento de 60 chunks consome 60 unidades. Como nenhum documento passa
    # de 66 chunks, um documento por minuto cabe na cota.
    # 65000 = 65 segundos, cinco a mais que a janela, por margem.
    pausa-entre-chamadas-ms: 65000
  resposta:
    chat:
      # Mesma variável de ambiente do embedding — carrega via spring.config.import
      # (ver comentário no topo deste arquivo).
      api-key: ${GEMINI_API_KEY}
      # Fixado explicitamente (CLAUDE.md) — não trocar por alias genérico.
      model-name: gemini-3.6-flash
    # Quantos chunks recuperados entram no contexto do prompt.
    limit: 5
    # Limiar de score de cosseno (0 a 1) para um chunk ser considerado
    # relevante o suficiente para entrar no contexto — MEDIDO, não chutado.
    # Fonte: harness da Etapa 4.2a (AvaliacaoRetrievalHarnessTest) contra os
    # 719 chunks reais, ver ~/Downloads/relatorios-agente-rag/2026-08-17-etapa-4-2a-conclusao.md.
    # O maior score entre os casos claramente fora de escopo foi 0.6397
    # (colisão de prazo de reembolso perguntada à Santo Pegasus, que não tem
    # esse conceito). O menor score entre os fatos com resposta legítima foi
    # 0.7201 (porta do ai-assistant-service, Santo Pegasus). 0.68 fica entre
    # os dois, com folga para ambos os lados. Ressalva já registrada no
    # relatório da 4.2a: essa separação NÃO é limpa em todo o conjunto —
    # alguns casos sem resposta real (ex.: CNPJ inexistente da BimBam, score
    # 0.7759) ficam acima deste limiar por serem topicamente relacionados;
    # é por isso que a Etapa 4.2b ainda depende do prompt de sistema (COMPORTA
    # 2) para admitir ausência mesmo quando o limiar sozinho deixa passar.
    threshold: 0.68

---
# Profile "recursivo" (Etapa 4.3 — decisão de chunking por medição): só troca a
# estratégia de chunking e a tabela de destino. Tudo o mais (datasource, chave de
# API, dimensão, pausa entre chamadas) continua herdado do documento acima — é
# assim que a configuração padrão da aplicação (sem este profile) segue apontando
# para "document_chunks"/"hybrid", e o híbrido continua sendo o caminho normal.
# Ativar junto com o profile "ingest" para rodar a ingestão de fato:
#   --spring.profiles.active=ingest,recursivo
spring:
  config:
    activate:
      on-profile: recursivo
app:
  ingestao:
    chunking:
      strategy: recursive
    vector-store:
      # Tabela separada — ver V2__chunks_recursivo.sql. Nunca "document_chunks".
      table: document_chunks_recursive